spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    listener:
      auto-startup: false
  ai:
    model:
      chat: none
      embedding: none

insightflow:
  ai:
    provider: mock
  rag:
    embeddings:
      provider: mock
      model: mock
      dimensions: 1536
  outbox:
    publisher:
      fixed-delay-ms: 600000
  automation:
    webhook:
      retry:
        scheduler-fixed-delay-ms: 600000
