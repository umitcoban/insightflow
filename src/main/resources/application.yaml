server:
  port: 8080

spring:
  application:
    name: insightflow
  datasource:
    url: jdbc:postgresql://localhost:5432/insightflow
    username: insightflow
    password: insightflow
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      client-id: insightflow-api
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        acks: all
        retries: 10
    consumer:
      group-id: insightflow-domain-events-consumer
      client-id: insightflow-api-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${INSIGHTFLOW_SECURITY_JWT_ISSUER_URI:http://localhost:8081/realms/insightflow}
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:ollama}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:ollama}
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: ${SPRING_AI_OLLAMA_PULL_MODEL_STRATEGY:never}
      chat:
        model: ${SPRING_AI_OLLAMA_CHAT_MODEL:llama3.1}
      embedding:
        model: ${SPRING_AI_OLLAMA_EMBEDDING_MODEL:mxbai-embed-large}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_CHAT_MODEL:gpt-5.6-terra}
      embedding:
        options:
          model: ${SPRING_AI_OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

insightflow:
  security:
    jwt:
      issuer-uri: ${INSIGHTFLOW_SECURITY_JWT_ISSUER_URI:http://localhost:8081/realms/insightflow}
      jwk-set-uri: ${INSIGHTFLOW_SECURITY_JWT_JWK_SET_URI:}
      audience: ${INSIGHTFLOW_SECURITY_JWT_AUDIENCE:insightflow-api}
      tenant-id-claim: tenant_id
      tenant-slug-claim: tenant_slug
  kafka:
    topics:
      domain-events: insightflow.domain-events
    consumer-groups:
      automation: insightflow-automation-consumer
      search-indexer: insightflow-search-indexer
  ai:
    provider: ${INSIGHTFLOW_AI_PROVIDER:spring-ai}
  search:
    elasticsearch:
      base-url: ${INSIGHTFLOW_ELASTICSEARCH_URL:http://localhost:9200}
      username: ${INSIGHTFLOW_ELASTICSEARCH_USERNAME:}
      password: ${INSIGHTFLOW_ELASTICSEARCH_PASSWORD:}
      feedback-index: insightflow-feedbacks
      knowledge-index: insightflow-knowledge-chunks
  rag:
    embeddings:
      provider: ${INSIGHTFLOW_RAG_EMBEDDINGS_PROVIDER:spring-ai}
      model: ${INSIGHTFLOW_RAG_EMBEDDINGS_MODEL:mxbai-embed-large}
      dimensions: ${INSIGHTFLOW_RAG_EMBEDDINGS_DIMENSIONS:1024}
  outbox:
    publisher:
      max-retry-count: 3
      base-delay-seconds: 10
  automation:
    webhook:
      default-timeout-ms: 5000
      min-timeout-ms: 100
      max-timeout-ms: 30000
      max-response-body-length: 10000
      retry:
        enabled: true
        max-attempts: 3
        initial-delay-ms: 5000
        multiplier: 2.0
        max-delay-ms: 300000
        scheduler-fixed-delay-ms: 2000
        batch-size: 20
        in-progress-timeout-ms: 60000

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [correlationId=%X{correlationId:-none}] [tenant=%X{tenantSlug:-none}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
